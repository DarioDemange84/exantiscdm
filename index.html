<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>⚽ Pronos World Cup 2026</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel pour JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, onSnapshot, setDoc, updateDoc, arrayUnion } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        window.FirebaseMods = {
            initializeApp, getAuth, signInAnonymously, signInWithCustomToken,
            getFirestore, doc, onSnapshot, setDoc, updateDoc, arrayUnion
        };
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
            /* Motif Terrain de Foot */
            background-color: #166534;
            background-image: repeating-linear-gradient(
                0deg,
                rgba(255,255,255,0.03),
                rgba(255,255,255,0.03) 40px,
                transparent 40px,
                transparent 80px
            );
            background-attachment: fixed;
        }

        /* Masquer les flèches des inputs number */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
        input[type=number] {
            -moz-appearance: textfield;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
        }

        .pitch-lines {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none;
            z-index: -1;
            border: 4px solid rgba(255, 255, 255, 0.1);
            margin: 20px;
            border-radius: 10px;
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }
    </style>
</head>
<body class="text-slate-800 antialiased min-h-screen pb-24">
    <div class="pitch-lines"></div>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect, useCallback } = React;

        const GROUPS = [
            { id: "grpA", name: "Groupe A", teams: ["Mexique 🇲🇽", "Nigéria 🇳🇬", "Pologne 🇵🇱", "Suède 🇸🇪"] },
            { id: "grpB", name: "Groupe B", teams: ["France 🇫🇷", "Colombie 🇨🇴", "Corée du Sud 🇰🇷", "Égypte 🇪🇬"] },
            { id: "grpC", name: "Groupe C", teams: ["Argentine 🇦🇷", "Pays-Bas 🇳🇱", "Japon 🇯🇵", "Sénégal 🇸🇳"] },
            { id: "grpD", name: "Groupe D", teams: ["Brésil 🇧🇷", "Angleterre 🏴󠁧󠁢󠁥󠁮󠁧󠁿", "USA 🇺🇸", "Maroc 🇲🇦"] }
        ];

        const MATCHES = [
            // Journée 1
            { id: "m1", team1: "Mexique", flag1: "🇲🇽", team2: "Nigéria", flag2: "🇳🇬", group: "Groupe A", date: "11 Juin 2026" },
            { id: "m2", team1: "Pologne", flag1: "🇵🇱", team2: "Suède", flag2: "🇸🇪", group: "Groupe A", date: "11 Juin 2026" },
            { id: "m3", team1: "France", flag1: "🇫🇷", team2: "Colombie", flag2: "🇨🇴", group: "Groupe B", date: "12 Juin 2026" },
            { id: "m4", team1: "Corée du Sud", flag1: "🇰🇷", team2: "Égypte", flag2: "🇪🇬", group: "Groupe B", date: "12 Juin 2026" },
            { id: "m5", team1: "Argentine", flag1: "🇦🇷", team2: "Pays-Bas", flag2: "🇳🇱", group: "Groupe C", date: "13 Juin 2026" },
            { id: "m6", team1: "Japon", flag1: "🇯🇵", team2: "Sénégal", flag2: "🇸🇳", group: "Groupe C", date: "13 Juin 2026" },
            { id: "m7", team1: "Brésil", flag1: "🇧🇷", team2: "Angleterre", flag2: "🏴󠁧󠁢󠁥󠁮󠁧󠁿", group: "Groupe D", date: "14 Juin 2026" },
            { id: "m8", team1: "USA", flag1: "🇺🇸", team2: "Maroc", flag2: "🇲🇦", group: "Groupe D", date: "14 Juin 2026" },
        ];

        const IconTrophy = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>;
        const IconEdit = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>;
        const IconShield = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>;
        const IconUser = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>;
        const IconLock = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>;
        const IconStar = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>;

        const App = () => {
            const [isFirebaseLoaded, setIsFirebaseLoaded] = useState(false);
            const [db, setDb] = useState(null);
            const [docRef, setDocRef] = useState(null);
            
            // État partagé structuré
            const [appState, setAppState] = useState({
                auth: {}, // { username: password }
                users: [], // ["Alex", "Marie"]
                predictions: {}, // { matchId: { userName: { t1, t2 } } }
                actualScores: {}, // { matchId: { t1, t2 } }
                bonusPredictions: {}, // { groupId: { userName: teamName } }
                actualBonus: {} // { groupId: teamName }
            });

            // État Utilisateur
            const [currentUser, setCurrentUser] = useState(localStorage.getItem('wc_username') || null);
            const [tempUsername, setTempUsername] = useState("");
            const [tempPassword, setTempPassword] = useState("");
            const [loginError, setLoginError] = useState("");
            
            // UI
            const [activeTab, setActiveTab] = useState('pronos'); // pronos, bonus, ranking, admin

            useEffect(() => {
                let unsubscribe = null;
                const checkInterval = setInterval(async () => {
                    if (window.FirebaseMods) {
                        clearInterval(checkInterval);
                        try {
                            const { initializeApp, getAuth, signInAnonymously, signInWithCustomToken, getFirestore, doc, onSnapshot, setDoc } = window.FirebaseMods;

                            const appId = typeof __app_id !== 'undefined' ? __app_id : 'wc-local-2026-v2';
                            const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : null;

                            if (!firebaseConfig) {
                                console.warn("Mode local uniquement. Pas de DB connectée.");
                                return;
                            }

                            const app = initializeApp(firebaseConfig);
                            const auth = getAuth(app);
                            
                            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                                await signInWithCustomToken(auth, __initial_auth_token);
                            } else {
                                await signInAnonymously(auth);
                            }

                            const firestore = getFirestore(app);
                            setDb(firestore);

                            const stateRef = doc(firestore, 'artifacts', appId, 'public', 'data', 'wc_state', 'global2');
                            setDocRef(stateRef);

                            unsubscribe = onSnapshot(stateRef, (document) => {
                                if (document.exists()) {
                                    setAppState(document.data());
                                } else {
                                    setDoc(stateRef, { auth: {}, users: [], predictions: {}, actualScores: {}, bonusPredictions: {}, actualBonus: {} }, { merge: true });
                                }
                                setIsFirebaseLoaded(true);
                            }, (error) => {
                                console.error("Erreur DB:", error);
                            });

                        } catch (err) {
                            console.error("Init échouée", err);
                        }
                    }
                }, 50);

                return () => {
                    clearInterval(checkInterval);
                    if (unsubscribe) unsubscribe();
                };
            }, []);

            const updateCloudData = async (updateObject) => {
                if (!db || !docRef || !window.FirebaseMods) return;
                const { updateDoc } = window.FirebaseMods;
                try {
                    await updateDoc(docRef, updateObject);
                } catch (e) {
                    console.error("Erreur sauvegarde:", e);
                }
            };

            const handleLogin = async (e) => {
                e.preventDefault();
                setLoginError("");
                const name = tempUsername.trim();
                const pwd = tempPassword.trim();
                
                if (!name || !pwd) {
                    setLoginError("Remplis tous les champs.");
                    return;
                }

                // Vérification du mot de passe
                if (appState.auth && appState.auth[name]) {
                    if (appState.auth[name] !== pwd) {
                        setLoginError("Mot de passe incorrect pour ce pseudo !");
                        return;
                    }
                } else {
                    // Nouvel utilisateur
                    if (db && docRef && window.FirebaseMods) {
                        const { arrayUnion } = window.FirebaseMods;
                        updateCloudData({
                            [`auth.${name}`]: pwd,
                            users: arrayUnion(name)
                        });
                    }
                }
                
                setCurrentUser(name);
                localStorage.setItem('wc_username', name);
            };

            const logout = () => {
                setCurrentUser(null);
                setTempPassword("");
                localStorage.removeItem('wc_username');
            };

            const handlePredictionChange = (matchId, team, value) => {
                const numValue = value === "" ? "" : parseInt(value, 10);
                
                const newPredictions = { ...appState.predictions };
                if (!newPredictions[matchId]) newPredictions[matchId] = {};
                if (!newPredictions[matchId][currentUser]) newPredictions[matchId][currentUser] = {};
                newPredictions[matchId][currentUser][team] = numValue;
                
                setAppState(prev => ({ ...prev, predictions: newPredictions }));
                updateCloudData({ [`predictions.${matchId}.${currentUser}.${team}`]: numValue });
            };

            const handleBonusPrediction = (groupId, teamName) => {
                const newBonus = { ...appState.bonusPredictions };
                if (!newBonus[groupId]) newBonus[groupId] = {};
                newBonus[groupId][currentUser] = teamName;
                
                setAppState(prev => ({ ...prev, bonusPredictions: newBonus }));
                updateCloudData({ [`bonusPredictions.${groupId}.${currentUser}`]: teamName });
            };

            const calculateMatchPoints = (predT1, predT2, actT1, actT2) => {
                if (predT1 === "" || predT2 === "" || actT1 === "" || actT2 === "" || actT1 === undefined || actT2 === undefined) return 0; 
                if (predT1 === actT1 && predT2 === actT2) return 3; // Score exact
                
                const predResult = predT1 > predT2 ? 1 : predT1 < predT2 ? -1 : 0;
                const actResult = actT1 > actT2 ? 1 : actT1 < actT2 ? -1 : 0;

                if (predResult === actResult) return 1; // Bon gagnant ou nul
                return 0; // Faux
            };

            const ranking = useMemo(() => {
                const usersToRank = appState.users.length > 0 ? appState.users : (currentUser ? [currentUser] : []);
                
                const scores = usersToRank.map(user => {
                    let matchPoints = 0;
                    let bonusPoints = 0;
                    let perfectScores = 0;
                    
                    // Points des matchs (3 pts / 1 pt)
                    MATCHES.forEach(match => {
                        const act = appState.actualScores[match.id];
                        const pred = appState.predictions[match.id]?.[user];
                        if (act && act.t1 !== undefined && act.t1 !== "" && pred) {
                            const pts = calculateMatchPoints(pred.t1, pred.t2, act.t1, act.t2);
                            matchPoints += pts;
                            if (pts === 3) perfectScores += 1;
                        }
                    });

                    // Points Bonus (+5 pts)
                    GROUPS.forEach(group => {
                        const actBonus = appState.actualBonus[group.id];
                        const predBonus = appState.bonusPredictions[group.id]?.[user];
                        if (actBonus && predBonus && actBonus === predBonus) {
                            bonusPoints += 5;
                        }
                    });
                    
                    return { user, totalPoints: matchPoints + bonusPoints, matchPoints, bonusPoints, perfectScores };
                });

                return scores.sort((a, b) => b.totalPoints - a.totalPoints || b.perfectScores - a.perfectScores);
            }, [appState, currentUser]);

            if (!currentUser) {
                return (
                    <div className="min-h-screen flex items-center justify-center p-4 relative z-10">
                        <div className="glass-panel p-8 rounded-3xl w-full max-w-sm animate-fade-in text-center border-t-8 border-t-green-500">
                            <div className="w-20 h-20 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-4 border-4 border-white shadow-lg">
                                <span className="text-4xl">⚽</span>
                            </div>
                            <h1 className="text-2xl font-black text-slate-800 tracking-tight">World Cup 2026</h1>
                            <p className="text-slate-500 font-medium text-sm mb-6 mt-1">Ton prono, tes règles.</p>
                            
                            {loginError && (
                                <div className="mb-4 bg-rose-100 text-rose-700 p-3 rounded-xl text-sm font-bold border border-rose-200">
                                    ⚠️ {loginError}
                                </div>
                            )}

                            <form onSubmit={handleLogin} className="space-y-3">
                                <div className="relative">
                                    <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                                        <IconUser />
                                    </div>
                                    <input 
                                        type="text" required maxLength="15" placeholder="Ton Pseudo" 
                                        value={tempUsername} onChange={(e) => setTempUsername(e.target.value)}
                                        className="w-full pl-10 pr-4 py-3 rounded-xl border-2 border-slate-200 focus:border-green-500 outline-none font-bold text-slate-700 bg-white/80"
                                    />
                                </div>
                                <div className="relative">
                                    <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                                        <IconLock />
                                    </div>
                                    <input 
                                        type="password" required placeholder="Mot de passe" 
                                        value={tempPassword} onChange={(e) => setTempPassword(e.target.value)}
                                        className="w-full pl-10 pr-4 py-3 rounded-xl border-2 border-slate-200 focus:border-green-500 outline-none font-bold text-slate-700 bg-white/80"
                                    />
                                </div>
                                <button type="submit" className="w-full bg-green-600 hover:bg-green-700 text-white font-black py-3.5 px-6 rounded-xl transition-all active:scale-95 shadow-md mt-2">
                                    ENTRER SUR LE TERRAIN
                                </button>
                            </form>
                            
                            <p className="mt-6 text-xs text-slate-400">Si tu es nouveau, mets le mot de passe de ton choix, il sera enregistré pour toi.</p>
                        </div>
                    </div>
                );
            }

            return (
                <div className="max-w-md sm:max-w-2xl mx-auto p-4 sm:p-6 animate-fade-in relative z-10">
                    
                    <header className="flex justify-between items-center mb-6 glass-panel p-4 rounded-2xl">
                        <div className="flex items-center gap-3">
                            <div className="w-10 h-10 bg-green-600 text-white rounded-xl flex items-center justify-center font-bold shadow-sm">
                                {currentUser.charAt(0).toUpperCase()}
                            </div>
                            <div>
                                <p className="text-[10px] text-green-700 font-bold uppercase tracking-widest opacity-80">Joueur</p>
                                <p className="font-black text-slate-800 leading-tight">{currentUser}</p>
                            </div>
                        </div>
                        <button onClick={logout} className="text-sm font-bold text-rose-500 hover:text-rose-600 bg-rose-50 px-3 py-1.5 rounded-lg border border-rose-100 transition-colors">
                            Quitter
                        </button>
                    </header>

                    <div className="fixed bottom-0 left-0 right-0 p-3 bg-white/90 backdrop-blur-xl border-t border-slate-200 z-50 sm:relative sm:bg-transparent sm:border-0 sm:p-0 sm:mb-6 sm:backdrop-blur-none">
                        <div className="flex max-w-md sm:max-w-2xl mx-auto gap-2">
                            <button onClick={() => setActiveTab('pronos')} className={`flex-1 flex flex-col sm:flex-row items-center justify-center gap-1 py-2 sm:py-3 text-xs sm:text-sm font-bold rounded-xl transition-all ${activeTab === 'pronos' ? 'bg-green-600 text-white shadow-lg shadow-green-600/30' : 'bg-white text-slate-500 hover:bg-slate-50'}`}>
                                <IconEdit /> <span className="mt-0.5 sm:mt-0">Matchs</span>
                            </button>
                            <button onClick={() => setActiveTab('bonus')} className={`flex-1 flex flex-col sm:flex-row items-center justify-center gap-1 py-2 sm:py-3 text-xs sm:text-sm font-bold rounded-xl transition-all ${activeTab === 'bonus' ? 'bg-yellow-500 text-white shadow-lg shadow-yellow-500/30' : 'bg-white text-slate-500 hover:bg-slate-50'}`}>
                                <IconStar /> <span className="mt-0.5 sm:mt-0">Bonus</span>
                            </button>
                            <button onClick={() => setActiveTab('ranking')} className={`flex-1 flex flex-col sm:flex-row items-center justify-center gap-1 py-2 sm:py-3 text-xs sm:text-sm font-bold rounded-xl transition-all ${activeTab === 'ranking' ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-600/30' : 'bg-white text-slate-500 hover:bg-slate-50'}`}>
                                <IconTrophy /> <span className="mt-0.5 sm:mt-0">Tableau</span>
                            </button>
                            <button onClick={() => setActiveTab('admin')} className={`flex-1 flex flex-col sm:flex-row items-center justify-center gap-1 py-2 sm:py-3 text-xs sm:text-sm font-bold rounded-xl transition-all ${activeTab === 'admin' ? 'bg-slate-800 text-white shadow-lg shadow-slate-800/30' : 'bg-white text-slate-500 hover:bg-slate-50'}`}>
                                <IconShield /> <span className="mt-0.5 sm:mt-0">Admin</span>
                            </button>
                        </div>
                    </div>

                    {}
                    <main className="mb-20 sm:mb-0">
                        {activeTab === 'pronos' && (
                            <div className="space-y-4">
                                {MATCHES.map(match => {
                                    const pred = appState.predictions[match.id]?.[currentUser] || {};
                                    const valT1 = pred.t1 !== undefined ? pred.t1 : "";
                                    const valT2 = pred.t2 !== undefined ? pred.t2 : "";

                                    const actual = appState.actualScores[match.id] || {};
                                    const isFinished = actual.t1 !== undefined && actual.t1 !== "";
                                    const points = isFinished ? calculateMatchPoints(pred.t1, pred.t2, actual.t1, actual.t2) : null;

                                    return (
                                        <div key={match.id} className="bg-white rounded-2xl shadow-md border-b-4 border-slate-200 overflow-hidden transform transition-all">
                                            <div className="bg-slate-800 px-4 py-2 flex justify-between items-center text-[10px] font-bold text-slate-300 uppercase tracking-widest">
                                                <span>{match.group}</span>
                                                <span className="text-green-400">{match.date}</span>
                                            </div>
                                            
                                            <div className="p-4 sm:p-5 flex items-center justify-between">
                                                <div className="flex-1 flex flex-col items-center gap-1">
                                                    <span className="text-4xl sm:text-5xl">{match.flag1}</span>
                                                    <span className="font-bold text-slate-700 text-xs sm:text-sm text-center uppercase">{match.team1}</span>
                                                </div>
                                                
                                                <div className="flex items-center gap-2 bg-slate-50 p-2 sm:p-3 rounded-2xl border-2 border-slate-100">
                                                    <input 
                                                        type="number" min="0" max="20" value={valT1} disabled={isFinished}
                                                        onChange={(e) => handlePredictionChange(match.id, 't1', e.target.value)}
                                                        className={`w-12 h-14 sm:w-14 sm:h-16 text-center text-2xl font-black rounded-xl focus:ring-4 focus:ring-green-100 focus:border-green-500 outline-none transition-all ${isFinished ? 'bg-transparent text-slate-400 border-transparent' : 'bg-white border-2 border-slate-200 text-slate-800 shadow-sm'}`}
                                                    />
                                                    <span className="text-slate-300 font-black">-</span>
                                                    <input 
                                                        type="number" min="0" max="20" value={valT2} disabled={isFinished}
                                                        onChange={(e) => handlePredictionChange(match.id, 't2', e.target.value)}
                                                        className={`w-12 h-14 sm:w-14 sm:h-16 text-center text-2xl font-black rounded-xl focus:ring-4 focus:ring-green-100 focus:border-green-500 outline-none transition-all ${isFinished ? 'bg-transparent text-slate-400 border-transparent' : 'bg-white border-2 border-slate-200 text-slate-800 shadow-sm'}`}
                                                    />
                                                </div>

                                                <div className="flex-1 flex flex-col items-center gap-1">
                                                    <span className="text-4xl sm:text-5xl">{match.flag2}</span>
                                                    <span className="font-bold text-slate-700 text-xs sm:text-sm text-center uppercase">{match.team2}</span>
                                                </div>
                                            </div>

                                            {isFinished && (
                                                <div className={`px-4 py-2.5 text-center text-xs font-bold flex justify-center items-center gap-2 ${points === 3 ? 'bg-green-500 text-white' : points === 1 ? 'bg-indigo-500 text-white' : 'bg-slate-200 text-slate-500'}`}>
                                                    <span>SCORE FINAL : {actual.t1} - {actual.t2}</span>
                                                    <span className="px-2 py-0.5 rounded-md bg-black/20">+{points} PTS</span>
                                                </div>
                                            )}
                                        </div>
                                    );
                                })}
                            </div>
                        )}

                        {}
                        {activeTab === 'bonus' && (
                            <div className="space-y-4">
                                <div className="bg-yellow-500 text-white p-5 rounded-2xl shadow-md border-b-4 border-yellow-600">
                                    <h2 className="text-xl font-black flex items-center gap-2 mb-1">
                                        <IconStar /> Pronostics Bonus
                                    </h2>
                                    <p className="text-yellow-100 text-sm font-medium">Devine qui finira premier de chaque groupe ! <strong>+5 Points</strong> par bonne réponse.</p>
                                </div>

                                {GROUPS.map(group => {
                                    const pred = appState.bonusPredictions[group.id]?.[currentUser] || "";
                                    const actual = appState.actualBonus[group.id] || "";
                                    const isFinished = actual !== "";
                                    const isCorrect = isFinished && pred === actual;

                                    return (
                                        <div key={group.id} className="bg-white p-4 rounded-2xl shadow-sm border-2 border-slate-100">
                                            <h3 className="font-black text-slate-800 mb-3">{group.name}</h3>
                                            <div className="grid grid-cols-2 gap-2">
                                                {group.teams.map(team => (
                                                    <button 
                                                        key={team}
                                                        disabled={isFinished}
                                                        onClick={() => handleBonusPrediction(group.id, team)}
                                                        className={`p-3 rounded-xl text-sm font-bold border-2 transition-all text-left flex justify-between items-center ${pred === team ? 'border-yellow-400 bg-yellow-50 text-yellow-800' : 'border-slate-100 bg-slate-50 text-slate-600 hover:border-slate-300'} ${isFinished && !isCorrect && pred === team ? 'opacity-50 grayscale' : ''} ${isFinished && actual === team ? 'border-green-500 bg-green-50 text-green-700' : ''}`}
                                                    >
                                                        <span>{team.split(' ')[0]}</span>
                                                        <span className="text-xl">{team.split(' ')[1]}</span>
                                                    </button>
                                                ))}
                                            </div>
                                            {isFinished && (
                                                <div className={`mt-3 p-2 rounded-lg text-center text-xs font-bold ${isCorrect ? 'bg-green-100 text-green-700' : 'bg-rose-100 text-rose-700'}`}>
                                                    {isCorrect ? '🎯 BINGO ! +5 PTS' : `❌ Faux. Le vainqueur était ${actual}`}
                                                </div>
                                            )}
                                        </div>
                                    );
                                })}
                            </div>
                        )}

                        {}
                        {activeTab === 'ranking' && (
                            <div className="bg-white rounded-2xl shadow-md border-b-4 border-slate-200 overflow-hidden">
                                <div className="bg-slate-800 p-5 text-white">
                                    <h2 className="text-xl font-black flex items-center gap-2">
                                        <IconTrophy /> Classement
                                    </h2>
                                </div>
                                <div className="p-2">
                                    {ranking.length === 0 ? (
                                        <p className="text-center text-slate-500 py-8 font-medium">Aucun joueur.</p>
                                    ) : (
                                        <div className="flex flex-col gap-1">
                                            {ranking.map((row, index) => (
                                                <div key={row.user} className={`flex items-center p-3 rounded-xl ${row.user === currentUser ? 'bg-green-50 border border-green-200' : 'hover:bg-slate-50 border border-transparent'}`}>
                                                    <div className="w-8 flex-shrink-0 text-center font-black text-lg">
                                                        {index === 0 ? '🏆' : index === 1 ? '🥈' : index === 2 ? '🥉' : <span className="text-slate-400">{index + 1}</span>}
                                                    </div>
                                                    <div className="ml-3 flex-1">
                                                        <p className={`font-black ${row.user === currentUser ? 'text-green-800' : 'text-slate-700'}`}>
                                                            {row.user}
                                                        </p>
                                                        <p className="text-[10px] text-slate-500 font-bold uppercase">
                                                            {row.matchPoints} pts (matchs) • {row.bonusPoints} pts (bonus)
                                                        </p>
                                                    </div>
                                                    <div className="text-xl font-black text-white bg-slate-800 px-4 py-2 rounded-xl shadow-inner">
                                                        {row.totalPoints}
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}

                        {}
                        {activeTab === 'admin' && (
                            <div className="space-y-6">
                                <div className="bg-rose-500 text-white p-5 rounded-2xl shadow-md">
                                    <h2 className="text-xl font-black flex items-center gap-2 mb-1">
                                        <IconShield /> Mode Admin
                                    </h2>
                                    <p className="text-rose-100 text-xs font-medium">Rentre les vrais scores et les vainqueurs de groupes ici. Les points seront distribués automatiquement à tout le monde.</p>
                                </div>

                                <div className="bg-white p-4 rounded-2xl border-2 border-slate-200 shadow-sm">
                                    <h3 className="font-black text-slate-800 mb-4 border-b pb-2">Scores des Matchs</h3>
                                    <div className="grid gap-3">
                                        {MATCHES.map(match => {
                                            const actual = appState.actualScores[match.id] || {};
                                            const actValT1 = actual.t1 !== undefined ? actual.t1 : "";
                                            const actValT2 = actual.t2 !== undefined ? actual.t2 : "";
                                            return (
                                                <div key={match.id} className="flex items-center justify-between bg-slate-50 p-2 rounded-xl border border-slate-100">
                                                    <span className="text-xl w-8 text-center">{match.flag1}</span>
                                                    <div className="flex items-center gap-1">
                                                        <input type="number" min="0" value={actValT1} onChange={(e) => {
                                                            const val = e.target.value === "" ? "" : parseInt(e.target.value, 10);
                                                            updateCloudData({ [`actualScores.${match.id}.t1`]: val });
                                                        }} className="w-10 h-10 text-center font-bold border rounded-lg" />
                                                        <span className="font-black text-slate-300">-</span>
                                                        <input type="number" min="0" value={actValT2} onChange={(e) => {
                                                            const val = e.target.value === "" ? "" : parseInt(e.target.value, 10);
                                                            updateCloudData({ [`actualScores.${match.id}.t2`]: val });
                                                        }} className="w-10 h-10 text-center font-bold border rounded-lg" />
                                                    </div>
                                                    <span className="text-xl w-8 text-center">{match.flag2}</span>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>

                                <div className="bg-white p-4 rounded-2xl border-2 border-slate-200 shadow-sm">
                                    <h3 className="font-black text-slate-800 mb-4 border-b pb-2">Vainqueurs des Groupes</h3>
                                    <div className="grid gap-3">
                                        {GROUPS.map(group => {
                                            const actual = appState.actualBonus[group.id] || "";
                                            return (
                                                <div key={group.id} className="flex flex-col gap-1">
                                                    <label className="text-xs font-bold text-slate-500 uppercase">{group.name}</label>
                                                    <select 
                                                        value={actual}
                                                        onChange={(e) => updateCloudData({ [`actualBonus.${group.id}`]: e.target.value })}
                                                        className="w-full p-3 rounded-xl border border-slate-300 font-bold bg-slate-50 text-slate-800 outline-none"
                                                    >
                                                        <option value="">-- En attente du résultat --</option>
                                                        {group.teams.map(t => <option key={t} value={t}>{t}</option>)}
                                                    </select>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
