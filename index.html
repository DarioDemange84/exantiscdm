<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prono CDM 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // 1. REMPLACE CES LIGNES PAR TES VRAIES CLÉS FIREBASE
        const firebaseConfig = {
            apiKey: "COPIE_TA_VRAIE_CLE_API_ICI",
            authDomain: "prono-cdm-64931.firebaseapp.com",
            projectId: "prono-cdm-64931",
            storageBucket: "prono-cdm-64931.appspot.com",
            messagingSenderId: "COPIE_TON_SENDER_ID_ICI",
            appId: "COPIE_TON_APP_ID_ICI"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // 2. LOGIQUE D'AFFICHAGE SIMPLE
        function loadData() {
            const docRef = doc(db, "pronostics", "masterDB");
            
            onSnapshot(docRef, (docSnap) => {
                const appDiv = document.getElementById('app-content');
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    appDiv.innerHTML = `<pre class="text-sm text-gray-800">${JSON.stringify(data, null, 2)}</pre>`;
                } else {
                    appDiv.innerHTML = `<p class="text-gray-500">Base de données vide ou document introuvable.</p>`;
                }
            }, (error) => {
                document.getElementById('app-content').innerHTML = `<p class="text-red-600 font-bold">Erreur de connexion : ${error.message}</p>`;
            });
        }

        window.onload = loadData;
    </script>
</head>
<body class="bg-gray-50 text-gray-900 p-6">
    <div class="max-w-3xl mx-auto bg-white rounded-lg shadow p-6">
        <h1 class="text-2xl font-bold mb-4 border-b pb-2">Dashboard Prono CDM 2026</h1>
        
        <div id="app-content" class="bg-gray-100 p-4 rounded overflow-auto border">
            <div class="animate-pulse flex space-x-4">
                <div class="flex-1 space-y-4 py-1">
                    <div class="h-2 bg-slate-300 rounded w-3/4"></div>
                    <div class="space-y-2">
                        <div class="h-2 bg-slate-300 rounded"></div>
                        <div class="h-2 bg-slate-300 rounded w-5/6"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
