<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pronostics CDM 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, onSnapshot, setDoc, updateDoc, deleteField } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        window.FirebaseMods = { initializeApp, getAuth, signInAnonymously, getFirestore, doc, onSnapshot, setDoc, updateDoc, deleteField };
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap');
        body { font-family: 'Montserrat', sans-serif; background-color: #0f172a; color: white; }
        .glass-panel { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .neon-glow:focus { box-shadow: 0 0 15px rgba(16, 185, 129, 0.5); }
    </style>
</head>
<body class="min-h-screen pb-24">
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect } = React;
        const MATCHES = [
            { id: "m1", team1: "Mexique", team2: "Afr. du Sud", group: "Gr. A" },
            { id: "m2", team1: "France", team2: "Sénégal", group: "Gr. I" },
            { id: "m3", team1: "Angleterre", team2: "Croatie", group: "Gr. L" }
        ];

        const App = () => {
            const [appState, setAppState] = useState({ predictions: {}, users: {} });
            const [user, setUser] = useState(localStorage.getItem('wc_username') || "");
            const [pass, setPass] = useState("");
            const [db, setDb] = useState(null);
            const isAdmin = user?.toLowerCase() === 'dario';

            useEffect(() => {
                const init = async () => {
                    if (window.FirebaseMods) {
                        const { initializeApp, getAuth, signInAnonymously, getFirestore, doc, onSnapshot } = window.FirebaseMods;
                        const app = initializeApp(typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {});
                        const auth = getAuth(app);
                        await signInAnonymously(auth);
                        const db = getFirestore(app);
                        setDb(db);
                        const docRef = doc(db, 'artifacts', typeof __app_id !== 'undefined' ? __app_id : 'wc-2026', 'public', 'data');
                        onSnapshot(docRef, (d) => { if(d.exists()) setAppState(d.data()); });
                    }
                };
                init();
            }, []);

            const updateDB = async (obj) => { 
                if(db) await window.FirebaseMods.updateDoc(window.FirebaseMods.doc(db, 'artifacts', typeof __app_id !== 'undefined' ? __app_id : 'wc-2026', 'public', 'data'), obj); 
            };
            
            const handleLogin = async (e) => {
                e.preventDefault();
                const users = appState.users || {};
                if (users[user] && users[user].pass !== pass) return alert("Mot de passe incorrect");
                if (!users[user]) await updateDB({ [`users.${user}`]: { pass } });
                localStorage.setItem('wc_username', user);
                window.location.reload();
            };

            const deleteAccount = async (targetUser) => {
                if (!isAdmin) return;
                await updateDB({ [`users.${targetUser}`]: window.FirebaseMods.deleteField() });
            };

            if (!user) return (
                <div className="flex h-screen items-center justify-center p-4">
                    <form onSubmit={handleLogin} className="glass-panel p-8 rounded-2xl w-full max-w-sm">
                        <h1 className="text-2xl font-black mb-6">CONNEXION</h1>
                        <input className="w-full p-3 bg-slate-900 rounded-lg mb-4" placeholder="Pseudo" onChange={e => setUser(e.target.value)}/>
                        <input className="w-full p-3 bg-slate-900 rounded-lg mb-6" type="password" placeholder="Mot de passe" onChange={e => setPass(e.target.value)}/>
                        <button className="w-full bg-emerald-500 py-3 font-bold rounded-lg uppercase">Entrer</button>
                    </form>
                </div>
            );

            return (
                <div className="max-w-2xl mx-auto p-4">
                    <h1 className="text-3xl font-black mb-6">PRONOSTICS CDM 2026</h1>
                    {MATCHES.map(m => (
                        <div key={m.id} className="glass-panel p-4 mb-4 rounded-xl flex items-center justify-between">
                            <span className="font-bold text-sm">{m.team1}</span>
                            <div className="flex gap-2">
                                <input className="w-12 h-10 bg-slate-900 text-center rounded neon-glow" type="number" onChange={e => updateDB({[`predictions.${m.id}.${user}.t1`]: parseInt(e.target.value)})} />
                                <span className="font-black self-center">:</span>
                                <input className="w-12 h-10 bg-slate-900 text-center rounded neon-glow" type="number" onChange={e => updateDB({[`predictions.${m.id}.${user}.t2`]: parseInt(e.target.value)})} />
                            </div>
                            <span className="font-bold text-sm">{m.team2}</span>
                        </div>
                    ))}
                    {isAdmin && (
                        <div className="mt-8 glass-panel p-6 rounded-2xl">
                            <h2 className="text-xl font-black mb-4 text-rose-500">GESTION COMPTES</h2>
                            {Object.keys(appState.users || {}).map(u => (
                                <div key={u} className="flex justify-between py-2 border-b border-white/10">
                                    <span>{u}</span>
                                    <button onClick={() => deleteAccount(u)} className="bg-rose-500 px-3 py-1 rounded text-xs font-bold">SUPPRIMER</button>
                                </div>
                            ))}
                        </div>
                    )}
                </div>
            );
        };
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
